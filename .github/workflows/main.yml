name: Tag and publish on merge to main
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/react-native-setup

      - name: Set package version
        run: npm version --no-git-tag-version "0.1.${{ github.run_number }}"

      - name: Build package
        run: |
          yarn prepare

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHING_TOKEN }}
        run: |
          # npm runs the prepare script on publish even with --ignore-scripts;
          # the package is already built by the previous step, so drop it.
          npm pkg delete scripts.prepare
          npm publish --access public --ignore-scripts

      # Tags created with GITHUB_TOKEN don't trigger other workflows, so
      # publishing happens above instead of relying on tag.yml.
      - name: Tag release
        run: |
          git tag "v0.1.${{ github.run_number }}"
          git push origin "v0.1.${{ github.run_number }}"
