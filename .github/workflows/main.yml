name: Tag and publish on merge to main
on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/react-native-setup

      - name: Set package version
        run: npm version --no-git-tag-version "1.0.${{ github.run_number }}"

      - name: Build package
        run: |
          yarn prepare

      # npm authenticates via OIDC trusted publishing (configured on npmjs.com
      # for this repo + workflow), which needs a recent npm and no auth token.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          # Bypass the .npmrc written by setup-node: its NODE_AUTH_TOKEN
          # template would shadow the OIDC flow.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc-publish
        run: |
          # npm runs the prepare script on publish even with --ignore-scripts;
          # the package is already built by the previous step, so drop it.
          npm pkg delete scripts.prepare
          npm publish --access public --ignore-scripts

      # Tags created with GITHUB_TOKEN don't trigger other workflows, so
      # publishing happens above instead of relying on a tag-triggered workflow.
      - name: Tag release
        run: |
          git tag "v1.0.${{ github.run_number }}"
          git push origin "v1.0.${{ github.run_number }}"
