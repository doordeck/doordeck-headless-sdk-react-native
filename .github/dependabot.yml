# .github/dependabot.yml
version: 2

updates:
  # JavaScript / TypeScript (root yarn workspace — covers the SDK and the example app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - "team:mobile-developers"
    groups:
      # The React Native monorepo releases every package on one version train
      # (react-native 0.87.0 <-> @react-native/* 0.87.0). Bumping any one of
      # them on its own leaves the workspace on mismatched versions and the
      # build fails, so they have to land together.
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-native-community/*"
          - "react"
          - "react-test-renderer"
          - "@types/react"
        update-types: ["major", "minor", "patch"]

      # Third-party native modules used by the example app. They peer-depend on
      # react-native and on each other (reanimated <-> worklets), so keep them
      # in step. Majors are left out - those tend to need code changes and
      # deserve their own PR.
      react-native-ecosystem:
        patterns:
          - "react-native-*"
          - "@react-navigation/*"
        update-types: ["minor", "patch"]

      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # Ruby gems used by the example app's iOS CocoaPods tooling
  - package-ecosystem: "bundler"
    directory: "/example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - "team:mobile-developers"
    groups:
      bundler-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # Android native dependencies (resolved from mavenCentral / google)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - "team:mobile-developers"
    groups:
      gradle-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    reviewers:
      - "team:mobile-developers"
    groups:
      actions-all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
